# Seules les feuilles visibles prises en charge du classeur APSF sont declarees.
# Les feuilles hidden et veryHidden sont toujours ignorees par le routeur.
families:
  apsf_activity:
    parser: ApsfActivityParser
    enabled: true
    family_sheets:
      - GLOBAL
      - AXA CREDIT
      - ASSALAF AL AKHDAR
      - DAR SALAF
      - EQDOM
      - FNAC
      - RCI
      - SALAFIN
      - SOFAC
