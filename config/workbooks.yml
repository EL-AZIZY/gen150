    types:
      PRETS_AFFECTES:
        - PRÊTS AFFECTÉS
        - PRETS AFFECTES
      PRETS_NON_AFFECTES:
        - PRÊTS NON AFFECTÉS
        - PRETS NON AFFECTES
    categories:
      VEHICULES:
        - VÉHICULES
        - VEHICULES
      EQUIPEMENT_DOMESTIQUE:
        - ÉQUIPEMENT DOMESTIQUE
        - EQUIPEMENT DOMESTIQUE
      AUTRES_PRECISER:
        - AUTRES À PRÉCISER
        - AUTRES A PRECISER
      PRETS_PERSONNELS:
        - PRÊTS PERSONNELS
        - PRETS PERSONNELS
      REVOLVING:
        - REVOLVING
    products:
      CREDIT_CLASSIQUE:
        - CRÉDIT CLASSIQUE
        - CREDIT CLASSIQUE
      LOA:
        - LOA
      MOURABAHA:
        - MOURABAHA
        - MOURABAH
      CNT:
        - CNT
      CMR:
        - CMR
      CONVENTIONS_PRIVEES:
        - CONVENTIONS PRIVÉES
        - CONVENTIONS PRIVEES
        - CONVENTIONS
      OP_BANCAIRE:
        - OP BANCAIRE
        - OPÉRATIONS BANCAIRES
        - OPERATIONS BANCAIRES

