activity_template: &activity_template
  family: apsf_activity
  limits:
    first_row: 1
    last_row: 117
    first_column: 1
    last_column: 9
  title_area:
    first_row: 1
    last_row: 3
    first_column: 1
    last_column: 9
  year_cells:
    reference: B7
    comparison: C7
  label_column: A
  data_columns:
    montant_reference_mad: B
    montant_comparaison_mad: C
    dossiers_reference: D
    dossiers_comparaison: E
    variation_montant_mad: F
    variation_montant_pct: G
    variation_dossiers_unites: H
    variation_dossiers_pct: I
  infer_sections: true
  default_section: ACTIVITE
  skip_labels:
    - PRÊTS AFFECTÉS
    - PRÊTS NON AFFECTÉS
    - Dossiers en nombre
  unit_tokens:
    - unité
    - unités
    - dirham
    - MAD
    - pourcentage
  sections:
    PRODUCTION_NETTE:
      - PRODUCTION NETTE
    ENCOURS_SAIN:
      - ENCOURS SAIN
      - ENCOURS SAINS
    ENCOURS_BRUT:
      - ENCOURS BRUT
      - ENCOURS BRUTS
    CREANCES_EN_SOUFFRANCE:
      - ENCOURS DES CRÉANCES EN SOUFFRANCE
      - ENCOURS DES CREANCES EN SOUFFRANCE
  hierarchy:
    types:
      PRETS_AFFECTES:
        - PRÊTS AFFECTÉS
        - PRETS AFFECTES
      PRETS_NON_AFFECTES:
        - PRÊTS NON AFFECTÉS
        - PRETS NON AFFECTES
    categories:
      VEHICULES:
        - VÉHICULES
        - VEHICULES
      EQUIPEMENT_DOMESTIQUE:
        - ÉQUIPEMENT DOMESTIQUE
        - EQUIPEMENT DOMESTIQUE
      AUTRES_PRECISER:
        - AUTRES À PRÉCISER
        - AUTRES A PRECISER
      PRETS_PERSONNELS:
        - PRÊTS PERSONNELS
        - PRETS PERSONNELS
      REVOLVING:
        - REVOLVING
    products:
      CREDIT_CLASSIQUE:
        - CRÉDIT CLASSIQUE
        - CREDIT CLASSIQUE
      LOA:
        - LOA
      MOURABAHA:
        - MOURABAHA
        - MOURABAH
      CNT:
        - CNT
      CMR:
        - CMR
      CONVENTIONS_PRIVEES:
        - CONVENTIONS PRIVÉES
        - CONVENTIONS PRIVEES
        - CONVENTIONS
      OP_BANCAIRE:
        - OP BANCAIRE
        - OPÉRATIONS BANCAIRES
        - OPERATIONS BANCAIRES

