activity_template: &activity_template
  family: apsf_activity
  limits:
    first_row: 1
    last_row: 117
    first_column: 1
    last_column: 9
  title_area:
    first_row: 1
    last_row: 3
    first_column: 1
    last_column: 9
  year_cells:
    reference: B7
    comparison: C7
  label_column: A
  data_columns:
